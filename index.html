<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FrontendByHeart | Регистрация и авторизация</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <div class="auth-box">

            <h1>Регистрация</h1>

            <input type="text" placeholder="Введите логин" class="input__login">

            <input type="email" placeholder="Введите почту" class="input__mail">

            <input type="password" placeholder="Введите пароль" class="input__pass">

            <p class="message"></p>

            <button class="btn_register">Зарегистрироваться</button>

            

        </div>

        <div class="auth-box">

            <h1>Авторизация</h1>

            <input type="text" placeholder="Введите логин" class="auth__login">

            <input type="password" placeholder="Введите пароль" class="auth__pass">

            <p class="message"></p>


            <button class="auth__btn">Войти</button>

           

        </div>

    </div>

    <script src="js/register.js" type="module"></script>
    <script src="js/auth.js" type="module"></script>
    <script src="js/checkAuth.js" type="module"></script>
    
    
    

</body>

</html>
